name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Python 환경 구성
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 10.CI_CD/requirements.txt

      # 4. Formatter 검사
      - name: Check formatting (black)
        run: black --check 10.CI_CD

      # 5. Lint
      - name: Lint (ruff)
        run: ruff check 10.CI_CD

      # 6. Type Check
      - name: Type check (mypy)
        run: mypy 10.CI_CD/app

      # 7. Pytest 실행
      - name: Run tests (pytest)
        run: pytest -v 10.CI_CD/app